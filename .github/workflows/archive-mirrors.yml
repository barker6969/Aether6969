name: Archive mirror repositories

# One-click archive of deprecated mirrors. Does NOT touch Aether6969.
#
# Setup (once):
#   1. Create a classic PAT or fine-grained token with Administration: Read and write
#      on aether, aether-phones, Aether69, aether.exe
#   2. Repo Settings → Secrets and variables → Actions
#      → New repository secret name: ARCHIVE_PAT  value: <token>
#   3. Actions → “Archive mirror repositories” → Run workflow

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ARCHIVE to confirm'
        required: true
        type: string

jobs:
  archive:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'ARCHIVE'
    permissions:
      contents: read
    steps:
      - name: Archive mirrors via API
        env:
          TOKEN: ${{ secrets.ARCHIVE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "Missing secret ARCHIVE_PAT. Add a PAT with admin on the mirror repos."
            exit 1
          fi

          OWNER="barker6969"
          MIRRORS=(aether aether-phones Aether69 aether.exe)

          for REPO in "${MIRRORS[@]}"; do
            FULL="${OWNER}/${REPO}"
            echo "Checking ${FULL}..."
            STATUS=$(curl -sS -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${FULL}" | jq -r '.archived // empty')

            if [ "${STATUS}" = "true" ]; then
              echo "  already archived"
              continue
            fi

            CODE=$(curl -sS -o /tmp/out.json -w "%{http_code}" -X PATCH \
              "https://api.github.com/repos/${FULL}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d '{"archived":true}')

            if [ "${CODE}" = "200" ]; then
              echo "  archived OK"
            else
              echo "  FAILED HTTP ${CODE}"
              cat /tmp/out.json
              exit 1
            fi
          done

          echo "Canonical repo left active: https://github.com/${OWNER}/Aether6969"
