name: MapleRoot APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Assemble variant"
        type: choice
        options:
          - debug
          - release
        default: debug
  push:
    tags:
      - "mapleroot-v*"

jobs:
  apk:
    name: Assemble APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mapleroot
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses + install packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Install clang (payload rebuild)
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      - name: Build freestanding payloads
        run: bash scripts/build-all.sh android13-5.15

      - name: Assemble Debug
        if: github.event.inputs.build_type != 'release' && !startsWith(github.ref, 'refs/tags/')
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble Release
        if: github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/')
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mapleroot-apk
          path: mapleroot/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14

  release:
    name: GitHub Release
    needs: apk
    if: startsWith(github.ref, 'refs/tags/mapleroot-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mapleroot-apk
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.apk
          generate_release_notes: true
          body: |
            MapleRoot on-device APK (`mapleroot-v*` tag).
            Install on a test device you own; first runs are debugging (see mapleroot/docs/STATUS.md).
