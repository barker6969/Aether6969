name: Cloudflare Pages · Download site

on:
  push:
    branches: [main]
    paths:
      - "download/**"
      - "wrangler.toml"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy download --project-name=aether-repair-download --commit-dirty=true
