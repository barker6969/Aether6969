name: MapleHost package

on:
  workflow_dispatch:
  push:
    tags:
      - "maplehost-v*"
    paths:
      - "maplehost/**"
      - ".github/workflows/maplehost-package.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maplehost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maplehost-dist
          path: maplehost/dist/*
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/maplehost-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: maplehost-dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
