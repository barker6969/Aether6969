name: Aether Desktop · Cross-platform release

# Builds the Tauri desktop wrapper for Windows / macOS / Linux and attaches
# the artifacts to a GitHub Release when a `desktop-vX.Y.Z` tag is pushed.
#
# Usage:
#   1. Push a tag matching the version in /aether-desktop/src-tauri/tauri.conf.json
#      and /app/frontend/src/lib/releases.js (DESKTOP_VERSION):
#        git tag desktop-v0.1.0
#        git push origin desktop-v0.1.0
#   2. This workflow fires, builds three OS matrix jobs, and creates a public
#      GitHub Release with:
#        - Aether_<version>_x64_en-US.msi   (Windows)
#        - Aether_<version>_universal.dmg   (macOS Intel + Apple Silicon)
#        - aether-desktop_<version>_amd64.AppImage  (Linux)
#   3. The in-app Get Desktop / Download buttons then resolve to real URLs.
#
# No secrets required for unsigned builds. Add TAURI_PRIVATE_KEY / TAURI_KEY_PASSWORD
# repo secrets later to enable Tauri auto-updater signing (see tauri.conf.json).

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. desktop-v0.1.0)"
        required: true

permissions:
  contents: write   # required to create the GitHub Release + upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi
            asset_glob: "src-tauri/target/release/bundle/msi/*.msi"
          - os: macos-latest
            target: universal-apple-darwin
            bundle: dmg
            asset_glob: "src-tauri/target/release/bundle/dmg/*.dmg"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: appimage
            asset_glob: "src-tauri/target/release/bundle/appimage/*.AppImage"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install Linux system deps (Ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            file

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "aether-desktop/src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Install frontend deps (Aether dashboard)
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend for embedding
        working-directory: frontend
        env:
          CI: "true"
          # Desktop build talks to localhost bridge — override at runtime if needed.
          REACT_APP_BACKEND_URL: "http://127.0.0.1:8001"
        run: yarn build

      - name: Install Tauri wrapper deps
        working-directory: aether-desktop
        run: yarn install --frozen-lockfile

      - name: Build Tauri (${{ matrix.bundle }})
        working-directory: aether-desktop
        run: yarn tauri build --target ${{ matrix.target }}
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-${{ matrix.bundle }}
          path: aether-desktop/${{ matrix.asset_glob }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -iname '*.msi' -o -iname '*.dmg' -o -iname '*.AppImage' \) -exec cp {} release/ \;
          ls -la release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: Aether Desktop ${{ github.ref_name || inputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*
