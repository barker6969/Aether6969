name: Maple CI

on:
  push:
    branches: [main, master]
    paths:
      - "mapleroot/**"
      - "maplehost/**"
      - ".github/workflows/maple-ci.yml"
  pull_request:
    paths:
      - "mapleroot/**"
      - "maplehost/**"
      - ".github/workflows/maple-ci.yml"
  workflow_dispatch:

jobs:
  contracts:
    name: Contract check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mapleroot
    steps:
      - uses: actions/checkout@v4
      - name: Check contracts
        run: bash scripts/check-contracts.sh

  maplehost:
    name: MapleHost smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maplehost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MapleHost
        run: python -m pip install -e .
      - name: Status (sibling mapleroot)
        env:
          MAPLEROOT_DIR: ${{ github.workspace }}/mapleroot
        run: maplehost status
      - name: Doctor
        env:
          MAPLEROOT_DIR: ${{ github.workspace }}/mapleroot
        run: maplehost doctor || true

  payloads:
    name: Build payloads (no kdir)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mapleroot
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Build hook.bin + splicehelper.bin
        run: bash scripts/build-all.sh android13-5.15
      - name: Upload payload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maple-payloads
          path: |
            mapleroot/app/src/main/assets/arm64-v8a/hook.bin
            mapleroot/app/src/main/assets/arm64-v8a/splicehelper.bin
          if-no-files-found: error
          retention-days: 14
