name: Release aether-desktop

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

jobs:
  build:
    name: Build · ${{ matrix.platform }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            bundle: dmg
          - platform: ubuntu-22.04
            args: ""
            bundle: appimage
          - platform: windows-latest
            args: ""
            bundle: msi

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libudev-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            aether-desktop/src-tauri -> target
            aether-cli -> target
          key: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: yarn install
        working-directory: aether-desktop

      # Build + stage aether-cli for Tauri externalBin (MSI/DMG/AppImage)
      - name: Prepare CLI sidecar
        run: node scripts/prepare-cli-sidecar.js
        working-directory: aether-desktop

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: aether-desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Aether Repair Tool ${{ github.ref_name }}"
          releaseBody: |
            ## Aether Repair Tool · ${{ github.ref_name }}

            Native desktop builds with **bundled aether-cli USB bridge**.

            On launch the app starts `aether-cli serve` automatically
            (`ws://127.0.0.1:8765`) so the dashboard can talk to USB devices
            without installing the CLI separately.

            **Downloads**
            - Windows `.msi` (includes `aether-cli.exe`)
            - macOS `.dmg` (universal)
            - Linux `.AppImage`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
